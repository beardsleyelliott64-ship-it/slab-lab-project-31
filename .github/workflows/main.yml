name: Build SlapLab Quest 3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed Unity project
        run: |
          rm -rf Assets Packages ProjectSettings
          mkdir -p /tmp/slaplab

          unzip -o SlapLab_Quest3_Fixed_Folders.zip -d /tmp/slaplab

          if [ -d "/tmp/slaplab/SlapLab_Quest3_Fixed_Folders" ]; then
            cp -a /tmp/slaplab/SlapLab_Quest3_Fixed_Folders/. .
          else
            cp -a /tmp/slaplab/. .
          fi

      - name: Verify Unity project
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings
          test -f ProjectSettings/ProjectVersion.txt
          test -f Assets/Scenes/Main.unity

      - name: Commit extracted Unity project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Assets Packages ProjectSettings

          if git diff --cached --quiet; then
            echo "No Unity project changes to commit."
          else
            git commit -m "Install fixed SlapLab Quest 3 Unity project"
            git push
          fi
